<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" role="img" aria-label="witan-node container topology: agent, node, volume, origin and mirrors" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs>
<rect width="960" height="396" rx="16" fill="#0B0C12"/>
<text x="32" y="46" font-size="21" font-weight="700" fill="#ECEEF2">witan-node in a container</text>
<text x="32" y="70" font-size="13.5" fill="#9BA1AD">The origin's dataset API, SQL and MCP, served from a volume; kept current and verified.</text>
<rect x="32" y="138" width="200" height="84" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2"/>
<text x="48" y="163" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Your agent or app</text>
<text x="48" y="183" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">SDK or MCP client</text>
<text x="48" y="201" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Bearer &lt;token&gt;</text>
<rect x="306" y="106" width="324" height="206" rx="12" fill="none" stroke="#9BA1AD" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="322" y="128" font-size="11.5" font-weight="600" fill="#6B7180" text-anchor="start" xml:space="preserve">witan-node container · uid 10001 · read-only root</text>
<rect x="322" y="142" width="292" height="64" rx="10" fill="#14151C" stroke="#7C5CFF" stroke-width="1.6"/>
<text x="338" y="167" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">wtn serve :8686</text>
<text x="338" y="187" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">API · SQL (DuckDB) · MCP /mcp</text>
<rect x="322" y="224" width="292" height="72" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2"/>
<text x="338" y="249" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">/data volume</text>
<text x="338" y="269" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">witan-data/  trust.json</text>
<rect x="712" y="118" width="216" height="84" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2"/>
<text x="728" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">WITAN origin</text>
<text x="728" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">pull the latest version</text>
<text x="728" y="181" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">--follow SLUG --verify</text>
<rect x="712" y="226" width="216" height="84" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="728" y="251" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Another node</text>
<text x="728" y="271" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">--upstream mirror</text>
<text x="728" y="289" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">signatures still checked</text>
<path d="M232 176L320 176" stroke="#9BA1AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="269" y="168" font-size="11.5" font-weight="400" fill="#6B7180" text-anchor="middle" xml:space="preserve">HTTP · MCP</text>
<path d="M614 164L710 158" stroke="#7C5CFF" stroke-width="1.5" fill="none" marker-end="url(#arrow-v)"/>
<text x="668" y="150" font-size="11.5" font-weight="400" fill="#6B7180" text-anchor="middle" xml:space="preserve">follow</text>
<path d="M614 190L710 256" stroke="#9BA1AD" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="676" y="214" font-size="11.5" font-weight="400" fill="#6B7180" text-anchor="middle" xml:space="preserve">or</text>
<path d="M468 206L468 222" stroke="#9BA1AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="32" y="350" font-size="12" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">docker run -d -p 127.0.0.1:8686:8686 -e WITAN_NODE_TOKEN=... -v witan-data:/data \</text>
<text x="32" y="370" font-size="12" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">  ghcr.io/kor-jongwon/witan-node --follow agent-api-observatory --verify</text>
</svg>
