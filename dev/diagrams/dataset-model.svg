<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 414" width="960" height="414" role="img" aria-label="Dataset versions are signed manifests of shared Parquet parts" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs>
<rect width="960" height="414" rx="16" fill="#0B0C12"/>
<text x="32" y="46" font-size="21" font-weight="700" fill="#ECEEF2">A dataset version is a signed list of parts</text>
<text x="32" y="70" font-size="13.5" fill="#9BA1AD">Like image layers: parts are content-addressed Parquet files that versions share.</text>
<text x="32" y="106" font-size="11" font-weight="600" fill="#6B7180" text-anchor="start" xml:space="preserve">VERSIONS (IMMUTABLE MANIFESTS)</text>
<rect x="32" y="118" width="272" height="92" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2"/>
<text x="48" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">v1 manifest</text>
<text x="48" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">signed by the origin</text>
<rect x="48" y="176" width="36" height="22" rx="5" fill="#4E5566"/>
<text x="66" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">a</text>
<rect x="92" y="176" width="36" height="22" rx="5" fill="#5B6275"/>
<text x="110" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">b</text>
<rect x="332" y="118" width="272" height="92" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2"/>
<text x="348" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">v2 manifest</text>
<text x="348" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">signed by the origin</text>
<rect x="348" y="176" width="36" height="22" rx="5" fill="#4E5566"/>
<text x="366" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">a</text>
<rect x="392" y="176" width="36" height="22" rx="5" fill="#5B6275"/>
<text x="410" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">b</text>
<rect x="436" y="176" width="36" height="22" rx="5" fill="#6F5CD6"/>
<text x="454" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">c</text>
<rect x="480" y="176" width="36" height="22" rx="5" fill="#8B6BE8"/>
<text x="498" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">d</text>
<rect x="632" y="118" width="272" height="92" rx="10" fill="#14151C" stroke="#7C5CFF" stroke-width="1.6"/>
<text x="648" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">v3 manifest</text>
<text x="648" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">signed by the origin</text>
<rect x="648" y="176" width="36" height="22" rx="5" fill="#4E5566"/>
<text x="666" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">a</text>
<rect x="692" y="176" width="36" height="22" rx="5" fill="#5B6275"/>
<text x="710" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">b</text>
<rect x="736" y="176" width="36" height="22" rx="5" fill="#6F5CD6"/>
<text x="754" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">c</text>
<rect x="780" y="176" width="36" height="22" rx="5" fill="#8B6BE8"/>
<text x="798" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">d</text>
<rect x="824" y="176" width="36" height="22" rx="5" fill="#FF5C87"/>
<text x="842" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">e</text>
<text x="32" y="262" font-size="11" font-weight="600" fill="#6B7180" text-anchor="start" xml:space="preserve">OBJECT STORE (CONTENT-ADDRESSED PARQUET PARTS, SHARED ACROSS VERSIONS)</text>
<rect x="32" y="274" width="164" height="56" rx="10" fill="#14151C" stroke="#4E5566" stroke-width="1.6"/>
<text x="48" y="298" font-size="14" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">part a</text>
<text x="48" y="317" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">&lt;sha256-a&gt;.parquet</text>
<rect x="212" y="274" width="164" height="56" rx="10" fill="#14151C" stroke="#5B6275" stroke-width="1.6"/>
<text x="228" y="298" font-size="14" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">part b</text>
<text x="228" y="317" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">&lt;sha256-b&gt;.parquet</text>
<rect x="392" y="274" width="164" height="56" rx="10" fill="#14151C" stroke="#6F5CD6" stroke-width="1.6"/>
<text x="408" y="298" font-size="14" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">part c</text>
<text x="408" y="317" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">&lt;sha256-c&gt;.parquet</text>
<rect x="572" y="274" width="164" height="56" rx="10" fill="#14151C" stroke="#8B6BE8" stroke-width="1.6"/>
<text x="588" y="298" font-size="14" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">part d</text>
<text x="588" y="317" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">&lt;sha256-d&gt;.parquet</text>
<rect x="752" y="274" width="164" height="56" rx="10" fill="#14151C" stroke="#FF5C87" stroke-width="1.6"/>
<text x="768" y="298" font-size="14" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">part e</text>
<text x="768" y="317" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">&lt;sha256-e&gt;.parquet</text>
<path d="M760 210L800 272" stroke="#7C5CFF" stroke-width="1.5" fill="none" marker-end="url(#arrow-v)"/>
<text x="812" y="246" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">pull v3 with v2 on disk:</text>
<text x="812" y="262" font-size="11.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">only part e transfers</text>
<text x="32" y="368" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">A contribution becomes new parts plus a new manifest. Old versions never change, so a pinned</text>
<text x="32" y="388" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">version answers the same query forever, and every part is checked against its SHA-256 on the way in.</text>
</svg>
