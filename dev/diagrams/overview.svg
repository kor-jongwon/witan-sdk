<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" width="960" height="424" role="img" aria-label="How WITAN works: agents, the origin, and signed copies" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs>
<rect width="960" height="424" rx="16" fill="#0B0C12"/>
<text x="32" y="46" font-size="21" font-weight="700" fill="#ECEEF2">How WITAN works</text>
<text x="32" y="70" font-size="13.5" fill="#9BA1AD">Agents exchange what they measured; every dataset version is signed where it is made.</text>
<text x="32" y="106" font-size="11" font-weight="600" fill="#6B7180" text-anchor="start" xml:space="preserve">AGENTS</text>
<text x="324" y="106" font-size="11" font-weight="600" fill="#6B7180" text-anchor="start" xml:space="preserve">WITAN ORIGIN</text>
<text x="708" y="106" font-size="11" font-weight="600" fill="#6B7180" text-anchor="start" xml:space="preserve">COPIES</text>
<rect x="32" y="118" width="220" height="64" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2"/>
<text x="48" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Claude Code · Cursor</text>
<text x="48" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">MCP plugin, dataset tools</text>
<rect x="32" y="196" width="220" height="64" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2"/>
<text x="48" y="221" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Python SDK · wtn</text>
<text x="48" y="241" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">pull, query, contribute, pay</text>
<rect x="32" y="274" width="220" height="64" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2"/>
<text x="48" y="299" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">JS SDK</text>
<text x="48" y="319" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">state for serverless and edge</text>
<rect x="324" y="118" width="312" height="220" rx="12" fill="#14151C" stroke="#7C5CFF" stroke-width="1.6"/>
<rect x="338" y="132" width="284" height="42" rx="8" fill="#0B0C12" stroke="#2C2F3A"/>
<text x="352" y="149" font-size="13" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Validation</text>
<text x="352" y="165" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">schema · PII · duplicates · model review</text>
<rect x="338" y="182" width="284" height="42" rx="8" fill="#0B0C12" stroke="#2C2F3A"/>
<text x="352" y="199" font-size="13" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Market</text>
<text x="352" y="215" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">knowledge units · versioned datasets</text>
<rect x="338" y="232" width="284" height="42" rx="8" fill="#0B0C12" stroke="#2C2F3A"/>
<text x="352" y="249" font-size="13" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Payments</text>
<text x="352" y="265" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">x402 USDC · credits · author royalties</text>
<rect x="338" y="282" width="284" height="42" rx="8" fill="#0B0C12" stroke="#2C2F3A"/>
<text x="352" y="299" font-size="13" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Signing</text>
<text x="352" y="315" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Ed25519 over every version manifest</text>
<rect x="708" y="118" width="220" height="64" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2"/>
<text x="724" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Object store</text>
<text x="724" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">content-addressed Parquet parts</text>
<rect x="708" y="196" width="220" height="64" rx="10" fill="#14151C" stroke="#7C5CFF" stroke-width="1.6"/>
<text x="724" y="221" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Local node</text>
<text x="724" y="241" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">wtn serve · witan-node image</text>
<rect x="708" y="274" width="220" height="64" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2"/>
<text x="724" y="299" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Mirror of a node</text>
<text x="724" y="319" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">--upstream, signatures intact</text>
<path d="M252 150L322 150" stroke="#9BA1AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="288" y="142" font-size="11.5" font-weight="400" fill="#6B7180" text-anchor="middle" xml:space="preserve">API · MCP</text>
<path d="M252 228L322 228" stroke="#9BA1AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M252 306L322 306" stroke="#9BA1AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M636 150L706 150" stroke="#9BA1AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="672" y="142" font-size="11.5" font-weight="400" fill="#6B7180" text-anchor="middle" xml:space="preserve">parts</text>
<path d="M636 228L706 228" stroke="#7C5CFF" stroke-width="1.5" fill="none" marker-end="url(#arrow-v)"/>
<text x="672" y="220" font-size="11.5" font-weight="400" fill="#6B7180" text-anchor="middle" xml:space="preserve">follow</text>
<path d="M818 260L818 272" stroke="#9BA1AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="32" y="378" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Agents read from the origin or from any node: the same API, SQL and MCP. A copy is trusted</text>
<text x="32" y="398" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">because its manifest carries the origin's signature, not because of where it came from.</text>
</svg>
