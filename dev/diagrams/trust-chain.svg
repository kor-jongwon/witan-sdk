<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-label="Origin signatures pass through nodes and mirrors and are verified by clients" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs>
<rect width="960" height="336" rx="16" fill="#0B0C12"/>
<text x="32" y="46" font-size="21" font-weight="700" fill="#ECEEF2">Signatures travel with the data</text>
<text x="32" y="70" font-size="13.5" fill="#9BA1AD">Pin the origin's keys once; then check a copy from anywhere, however many hops it took.</text>
<rect x="32" y="118" width="196" height="96" rx="10" fill="#14151C" stroke="#7C5CFF" stroke-width="1.6"/>
<text x="48" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Origin</text>
<text x="48" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">signs each manifest</text>
<text x="48" y="181" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">key k2, endorsed by k1</text>
<rect x="312" y="118" width="196" height="96" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2"/>
<text x="328" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Node or mirror</text>
<text x="328" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">stores, serves copies</text>
<text x="328" y="181" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">signature unchanged</text>
<rect x="592" y="118" width="196" height="96" rx="10" fill="#14151C" stroke="#2C2F3A" stroke-width="1.2"/>
<text x="608" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Your client</text>
<text x="608" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">pinned k1 (trust add)</text>
<text x="608" y="181" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">follows k1 → k2</text>
<rect x="848" y="118" width="80" height="42" rx="8" fill="#14151C" stroke="#7C5CFF" stroke-width="1.6"/>
<text x="888" y="144" font-size="13" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">verified</text>
<rect x="848" y="172" width="80" height="42" rx="8" fill="#14151C" stroke="#FF5C87" stroke-width="1.6"/>
<text x="888" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">Signature</text>
<text x="888" y="205" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">Error</text>
<path d="M228 166L310 166" stroke="#9BA1AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="269" y="156" font-size="11.5" font-weight="400" fill="#6B7180" text-anchor="middle" xml:space="preserve">signed</text>
<path d="M508 166L590 166" stroke="#9BA1AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="549" y="156" font-size="11.5" font-weight="400" fill="#6B7180" text-anchor="middle" xml:space="preserve">unchanged</text>
<path d="M788 150L846 139" stroke="#7C5CFF" stroke-width="1.5" fill="none" marker-end="url(#arrow-v)"/>
<path d="M788 182L846 193" stroke="#9BA1AD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="32" y="262" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Key rotation: the old key endorses the new one, and the endorsement travels inside every signature,</text>
<text x="32" y="282" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">so clients pinned to k1 keep verifying after the origin moves to k2. A revoked key stops counting at once.</text>
<text x="32" y="310" font-size="12" font-weight="400" fill="#6B7180" text-anchor="start" xml:space="preserve" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace">Python: verify=True or WITAN_VERIFY=1 · JS: manifest(slug, { verify: keys }) · node: wtn serve --verify</text>
</svg>
