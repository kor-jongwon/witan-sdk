name: publish

# This repository is the public mirror of sdk/python in the WITAN platform repo and
# the only place releases are cut. Tag vX.Y.Z (matching pyproject version) to publish
# via PyPI Trusted Publishing — no token is stored anywhere.
#
# The same tag builds the witan-node container image from the very wheel PyPI got and
# pushes it to ghcr.io/<owner>/witan-node (GITHUB_TOKEN, no stored credential), with a
# signed build provenance. When the `container` environment holds DOCKERHUB_USERNAME and
# DOCKERHUB_REPO (variables) and DOCKERHUB_TOKEN (secret), the image is also copied to
# Docker Hub digest for digest; without them that step says so and passes.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests
      - run: python -m build

  image-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel
      - name: Build the image (not pushed)
        run: docker build -t witan-node:ci --build-arg VERSION=ci .
      - name: Smoke test
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          bash docker/smoke.sh witan-node:ci "$v"

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: pip install build && python -m build
      # the image job installs exactly these files
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    needs: [publish, image-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: container
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - id: meta
        run: |
          v=${GITHUB_REF_NAME#v}
          {
            echo "version=$v"
            echo "minor=${v%.*}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/witan-node"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.minor }}
            ${{ steps.meta.outputs.image }}:latest
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Copy to Docker Hub (when configured)
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
          MINOR: ${{ steps.meta.outputs.minor }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ] || [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_REPO" ]; then
            echo "::notice::Docker Hub is not configured (DOCKERHUB_USERNAME and DOCKERHUB_REPO variables, DOCKERHUB_TOKEN secret in the container environment) — published to GHCR only"
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          for t in "$VERSION" "$MINOR" latest; do
            docker buildx imagetools create -t "docker.io/$DOCKERHUB_REPO:$t" "$IMAGE@$DIGEST"
          done
          got=$(docker buildx imagetools inspect "docker.io/$DOCKERHUB_REPO:$VERSION" --format '{{.Manifest.Digest}}')
          [ "$got" = "$DIGEST" ] || { echo "Docker Hub has $got, GHCR has $DIGEST"; exit 1; }
          echo "docker.io/$DOCKERHUB_REPO:$VERSION = $IMAGE@$DIGEST"
