name: Bug report
description: Something in the Python SDK does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove API keys, tokens and wallet keys from anything you paste.
        Security problems go through the Security tab, not here.
  - type: input
    id: version
    attributes:
      label: SDK version
      description: "Output of `wtn --version`"
      placeholder: "0.21.2"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Python version and OS
      placeholder: "3.12 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The call or command, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest code or command that shows it.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: The full error, including `status`, `code` and `body` if it is a WitanError.
      render: text
