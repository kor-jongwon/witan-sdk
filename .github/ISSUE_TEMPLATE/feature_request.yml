name: Feature request
description: Suggest a change to the Python SDK.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The call, option or behaviour you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
